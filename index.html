<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRAKEN</title>
<link rel="icon" href="1.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --display:'Space Grotesk', sans-serif;
  --body-font:'Inter', sans-serif;
  --mono:'JetBrains Mono', monospace;
  --max-w:1360px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#ffffff;
  color:#111111;
  font-family:var(--body-font);
  min-height:100svh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  display:flex;
  flex-direction:column;
}
a{color:inherit;text-decoration:none;}
::selection{background:#111;color:#fff;}

/* ---------- nav ---------- */
nav{
  position:relative;
  z-index:5;
  background:#ffffff;
  border-bottom:1px solid #e5e5e5;
  padding:0 clamp(20px,4vw,48px);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 8px 30px rgba(0,0,0,.04);
}
.nav-inner{
  width:100%;
  max-width:var(--max-w);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  padding:14px 0;
  min-height:118px;
}
nav .logo-mark{
  display:block;
  width:auto;
  height:clamp(78px,7vw,108px);
  object-fit:contain;
  object-position:left center;
  flex-shrink:0;
  transition:transform .25s ease;
}
nav .logo-mark:hover{transform:scale(1.03);}
nav .nav-right{
  display:flex;
  align-items:center;
  gap:10px;
}
.pill-btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:#000000;
  color:#ffffff;
  border:none;
  border-radius:100px;
  padding:12px 22px;
  font-family:var(--display);
  font-weight:700;
  font-size:13.5px;
  letter-spacing:.01em;
  transition:background .2s ease, transform .2s ease;
  white-space:nowrap;
  cursor:pointer;
}
.pill-btn:hover{background:#222;transform:translateY(-1px);}
.pill-btn svg{flex-shrink:0;}
.icon-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:44px;height:44px;
  border-radius:100px;
  background:#000000;
  border:1px solid #000000;
  color:#ffffff;
  transition:background .2s ease, transform .2s ease;
  flex-shrink:0;
}
.icon-btn:hover{background:#222;transform:translateY(-1px);}
@media (max-width:768px){
  .nav-inner{min-height:96px;padding:12px 0;}
  nav .logo-mark{height:58px;}
  nav .nav-right{gap:8px;}
  .icon-btn{width:40px;height:40px;}
}
@media (max-width:480px){
  .nav-inner{flex-wrap:wrap;row-gap:10px;}
  nav .logo-mark{height:48px;}
  .pill-btn span.label{display:none;}
  .pill-btn{padding:12px;}
}

/* ---------- hero ---------- */
.hero{
  position:relative;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  padding:0 clamp(20px,4vw,48px);
}
.tendrils{position:absolute;inset:0;width:100%;height:100%;opacity:.5;z-index:0;}
.tendrils path{
  fill:none;
  stroke:url(#tendrilGrad);
  stroke-width:1;
  stroke-linecap:round;
  stroke-dasharray:6 10;
  animation:drift 26s linear infinite;
}
.tendrils path:nth-child(2){animation-duration:34s;animation-direction:reverse;opacity:.6;}
.tendrils path:nth-child(3){animation-duration:19s;opacity:.4;}
@keyframes drift{ to{ stroke-dashoffset:-1000; } }
.cursor-glow{
  position:absolute;
  width:520px;height:520px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(0,0,0,.05) 0%, transparent 70%);
  pointer-events:none;
  transform:translate(-50%,-50%);
  left:50%;top:45%;
  transition:left .5s ease-out, top .5s ease-out;
  filter:blur(4px);
  z-index:0;
}
.hero-inner{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  gap:clamp(28px,6vw,56px);
  max-width:var(--max-w);
  width:100%;
  margin:0 auto;
  padding:clamp(48px,8vw,96px) 0 clamp(56px,9vw,110px);
}
.wordmark{
  font-family:var(--display);
  font-weight:700;
  font-size:clamp(56px, 12vw, 180px);
  line-height:.9;
  letter-spacing:-.03em;
  display:flex;
  overflow:hidden;
}
.wordmark span{
  display:inline-block;
  transform:translateY(110%);
  animation:riseIn .9s cubic-bezier(.2,.8,.2,1) forwards;
}
.wordmark span:nth-child(1){animation-delay:.1s;}
.wordmark span:nth-child(2){animation-delay:.17s;}
.wordmark span:nth-child(3){animation-delay:.24s;}
.wordmark span:nth-child(4){animation-delay:.31s;}
.wordmark span:nth-child(5){animation-delay:.38s;}
.wordmark span:nth-child(6){animation-delay:.45s;}
@keyframes riseIn{ to{ transform:translateY(0); opacity:1; } }

.hero-sub{
  color:#666;
  font-size:clamp(14px,1.4vw,16px);
  max-width:520px;
  line-height:1.5;
  opacity:0;
  animation:riseIn .8s .5s ease forwards;
}

/* ---------- CTA buttons ---------- */
.cta-row{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  opacity:0;
  animation:riseIn .8s .6s ease forwards;
}
.cta-btn{
  position:relative;
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:18px 32px;
  font-family:var(--display);
  font-weight:700;
  font-size:14px;
  letter-spacing:.02em;
  text-transform:uppercase;
  border-radius:100px;
  cursor:pointer;
  transition:transform .25s cubic-bezier(.2,.8,.2,1), background .25s ease, color .25s ease;
  border:2px solid #000;
  background:#000;
  color:#fff;
}
.cta-btn:active{transform:scale(.97);}
.cta-btn:hover{background:#222;color:#fff;transform:translateY(-2px);}
.cta-btn.outline{background:#fff;color:#000;}
.cta-btn.outline:hover{background:#f2f2f2;color:#000;}
.cta-btn .arrow{transition:transform .3s ease;}
.cta-btn:hover .arrow{transform:translateX(3px);}

/* ---------- footer ---------- */
footer{
  position:relative;
  z-index:2;
  display:flex;
  justify-content:center;
  padding:0 clamp(20px,4vw,48px) 34px;
}
.footer-inner{
  width:100%;
  max-width:var(--max-w);
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
  font-family:var(--mono);
  font-size:11px;
  color:#888;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;}
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(#f0f0f0 1px,transparent 1px),
    linear-gradient(90deg,#f0f0f0 1px,transparent 1px);
  background-size:48px 48px;
  opacity:.6;
  z-index:-1;
}
body::after{
  content:"";
  position:fixed;
  inset:18px;
  border:1px solid #ececec;
  pointer-events:none;
  z-index:10;
}
.hero::before,.hero::after{
  content:"";
  position:absolute;
  top:0;bottom:0;
  width:1px;
  background:#ececec;
  z-index:1;
}
.hero::before{left:calc(50% - (min(100vw,var(--max-w)) / 2));}
.hero::after{right:calc(50% - (min(100vw,var(--max-w)) / 2));}
@media (max-width:1420px){
  .hero::before{left:clamp(20px,4vw,48px);}
  .hero::after{right:clamp(20px,4vw,48px);}
}

/* ---------- catalog ---------- */
.catalog{
  position:relative;
  z-index:2;
  display:flex;
  justify-content:center;
  padding:0 clamp(20px,4vw,48px) 100px;
  scroll-margin-top:40px;
}
.catalog-inner{
  width:100%;
  max-width:var(--max-w);
}
.catalog-head{
  max-width:640px;
  margin-bottom:36px;
}
.catalog-head h2{
  font-family:var(--display);
  font-weight:700;
  font-size:clamp(30px,3.6vw,42px);
  letter-spacing:-.01em;
}
.catalog-head p{
  color:#666;
  font-size:14.5px;
  margin-top:8px;
  line-height:1.5;
}
.catalog-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(250px, 1fr));
  gap:22px;
}
.product-card{
  border:1px solid #eaeaea;
  border-radius:20px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  transition:border-color .25s ease, transform .25s ease, box-shadow .25s ease;
  background:#fff;
}
.product-card:hover{border-color:#ccc;transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.06);}
.product-photo{
  width:100%;
  aspect-ratio:1/1;
  background:#f5f5f5;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.product-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.product-photo .ph-placeholder{
  font-family:var(--mono);
  font-size:11.5px;
  color:#aaa;
  text-align:center;
  padding:12px;
}
.product-info{
  padding:18px 20px 22px;
  display:flex;
  flex-direction:column;
  gap:5px;
  flex:1;
}
.product-name{
  font-family:var(--display);
  font-weight:700;
  font-size:17px;
}
.product-spec{
  font-family:var(--mono);
  font-size:11.5px;
  color:#777;
}
.product-desc{
  font-size:12.5px;
  color:#888;
  line-height:1.45;
  margin-top:2px;
}
.product-price{
  margin-top:auto;
  padding-top:12px;
  font-family:var(--display);
  font-weight:700;
  font-size:19px;
}
.product-buy{
  margin-top:10px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  background:#000;
  color:#fff;
  border-radius:100px;
  padding:11px 18px;
  font-family:var(--display);
  font-weight:700;
  font-size:12.5px;
  text-transform:uppercase;
  letter-spacing:.02em;
  transition:background .2s ease;
}
.product-buy:hover{background:#222;}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <img src="1.png" alt="KRAKEN" class="logo-mark">
    <div class="nav-right">
      <a class="pill-btn" href="#catalog">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
        </svg>
        <span class="label">Ассортимент</span>
      </a>
      <a class="icon-btn" data-cta="manager" href="#" target="_blank" rel="noopener" aria-label="Менеджер" title="Менеджер">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" y1="7" x2="14" y2="7"></line>
          <line x1="4" y1="12" x2="20" y2="12"></line>
          <line x1="4" y1="17" x2="16" y2="17"></line>
        </svg>
      </a>
    </div>
  </div>
</nav>

<header class="hero" id="hero">
  <svg class="tendrils" viewBox="0 0 1200 800" preserveAspectRatio="none">
    <defs>
      <linearGradient id="tendrilGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#000000"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="M -50 620 C 200 550, 300 700, 550 600 S 900 480, 1250 560"/>
    <path d="M -50 200 C 250 260, 350 120, 620 200 S 950 320, 1250 180"/>
    <path d="M -50 420 C 200 380, 420 480, 700 400 S 1000 360, 1250 430"/>
  </svg>
  <div class="cursor-glow" id="cursorGlow"></div>
  <div class="hero-inner">
    <h1 class="wordmark" aria-label="KRAKEN">
      <span>K</span><span>R</span><span>A</span><span>K</span><span>E</span><span>N</span>
    </h1>
    <p class="hero-sub">Оригинальные iPhone в наличии. Актуальные позиции и цены — в разделе «Ассортимент» ниже.</p>
    <div class="cta-row">
      <a class="cta-btn" href="#catalog">Ассортимент <span class="arrow">→</span></a>
      <a class="cta-btn outline" data-cta="manager" href="#" target="_blank" rel="noopener">Менеджер <span class="arrow">→</span></a>
    </div>
  </div>
</header>

<section class="catalog" id="catalog">
  <div class="catalog-inner">
    <div class="catalog-head">
      <h2>Ассортимент</h2>
      <p>Актуальные позиции в наличии. Нажмите «Заказать», чтобы написать менеджеру.</p>
    </div>
    <div class="catalog-grid" id="catalogGrid"></div>
  </div>
</section>

<footer>
  <div class="footer-inner">
    <span>KRAKEN © 2026</span>
  </div>
</footer>

<script>
/* ======================================================
   КОНФИГ ССЫЛОК
====================================================== */
const CONFIG = {
  managerUrl: "https://t.me/krak_24?text=%D1%85%D0%BE%D1%87%D1%83%20%D0%BF%D1%80%D0%B8%D0%BE%D0%B1%D1%80%D0%B5%D1%81%D1%82%D0%B8%20%D1%82%D0%BE%D0%B2%D0%B0%D1%80%0A%0A%D0%BC%D0%BE%D0%B9%20%D1%80%D0%B0%D0%B9%D0%BE%D0%BD%3A%0A%D0%B3%D0%BE%D1%80%D0%BE%D0%B4%3A%0A%D1%82%D0%BE%D0%B2%D0%B0%D1%80%2C%20%D0%BA%D0%BE%D1%82%D0%BE%D1%80%D1%8B%D0%B9%20%D0%BC%D0%BD%D0%B5%20%D0%BD%D1%83%D0%B6%D0%B5%D0%BD%3A"
};
document.querySelectorAll('[data-cta="manager"]').forEach(el => el.href = CONFIG.managerUrl);

/* ======================================================
   ТОВАРЫ ПО УМОЛЧАНИЮ
   Правьте вручную ИЛИ через /admin777 (там же кнопка «Экспорт»,
   которая сгенерирует готовый блок для замены этого массива).

   photo — имя файла фото (положите рядом с index.html) или ""
   name  — название/модель
   spec  — короткая характеристика (память, цвет)
   desc  — короткое описание
   price — цена строкой, например "64 990 ₽"
====================================================== */
const DEFAULT_PRODUCTS = [
  { photo:"", name:"iPhone 15 Pro Max", spec:"256 ГБ · Титан natural", desc:"Новый, запечатан", price:"0 ₽" },
  { photo:"", name:"iPhone 15 Pro",     spec:"128 ГБ · Титан blue",    desc:"Новый, запечатан", price:"0 ₽" },
  { photo:"", name:"iPhone 15",         spec:"128 ГБ · Чёрный",        desc:"Новый, запечатан", price:"0 ₽" },
  { photo:"", name:"iPhone 15 Plus",    spec:"256 ГБ · Розовый",       desc:"Новый, запечатан", price:"0 ₽" },
  { photo:"", name:"iPhone 14 Pro",     spec:"128 ГБ · Фиолетовый",    desc:"Новый, запечатан", price:"0 ₽" },
  { photo:"", name:"iPhone 14",         spec:"128 ГБ · Синий",         desc:"Новый, запечатан", price:"0 ₽" },
  { photo:"", name:"iPhone 13",         spec:"128 ГБ · Полночь",       desc:"Новый, запечатан", price:"0 ₽" },
  { photo:"", name:"iPhone 13 mini",    spec:"128 ГБ · Розовый",       desc:"Новый, запечатан", price:"0 ₽" },
  { photo:"", name:"iPhone SE (2022)",  spec:"64 ГБ · Красный",        desc:"Новый, запечатан", price:"0 ₽" },
  { photo:"", name:"iPhone 12",         spec:"64 ГБ · Зелёный",        desc:"Хорошее состояние", price:"0 ₽" },
];

/* Живой предпросмотр: если в этом браузере есть сохранённые
   через /admin777 изменения — используем их, иначе дефолт. */
function loadProducts(){
  try{
    const saved = localStorage.getItem('kraken_products');
    if(saved) return JSON.parse(saved);
  }catch(e){}
  return DEFAULT_PRODUCTS;
}

function renderCatalog(){
  const grid = document.getElementById('catalogGrid');
  const products = loadProducts();
  grid.innerHTML = '';
  products.forEach(p=>{
    const card = document.createElement('div');
    card.className = 'product-card';

    const photoWrap = document.createElement('div');
    photoWrap.className = 'product-photo';
    if(p.photo){
      const img = document.createElement('img');
      img.src = p.photo;
      img.alt = p.name || '';
      photoWrap.appendChild(img);
    } else {
      const ph = document.createElement('div');
      ph.className = 'ph-placeholder';
      ph.textContent = 'Добавьте фото товара';
      photoWrap.appendChild(ph);
    }

    const info = document.createElement('div');
    info.className = 'product-info';

    const name = document.createElement('div');
    name.className = 'product-name';
    name.textContent = p.name || '';               // textContent — не HTML, XSS исключён

    const spec = document.createElement('div');
    spec.className = 'product-spec';
    spec.textContent = p.spec || '';

    const desc = document.createElement('div');
    desc.className = 'product-desc';
    desc.textContent = p.desc || '';

    const price = document.createElement('div');
    price.className = 'product-price';
    price.textContent = p.price || '';

    const buy = document.createElement('a');
    buy.className = 'product-buy';
    buy.href = CONFIG.managerUrl;
    buy.target = '_blank';
    buy.rel = 'noopener';
    buy.textContent = 'Заказать';

    info.append(name, spec, desc, price, buy);
    card.append(photoWrap, info);
    grid.appendChild(card);
  });
}
renderCatalog();

// cursor glow within hero
const hero = document.getElementById('hero');
const glow = document.getElementById('cursorGlow');
hero.addEventListener('mousemove', (e)=>{
  const r = hero.getBoundingClientRect();
  glow.style.left = (e.clientX - r.left) + 'px';
  glow.style.top = (e.clientY - r.top) + 'px';
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRAKEN</title>
<link rel="icon" href="1.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --display:'Space Grotesk', sans-serif;
  --body-font:'Inter', sans-serif;
  --mono:'JetBrains Mono', monospace;
  --max-w:1360px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#ffffff;
  color:#111111;
  font-family:var(--body-font);
  min-height:100svh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  display:flex;
  flex-direction:column;
}
a{color:inherit;text-decoration:none;}
::selection{background:#111;color:#fff;}

/* ---------- nav ---------- */
nav{
  position:relative;
  z-index:5;
  background:#ffffff;
  border-bottom:1px solid #e5e5e5;
  padding:0 clamp(20px,4vw,48px);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 8px 30px rgba(0,0,0,.04);
}
.nav-inner{
  width:100%;
  max-width:var(--max-w);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  padding:14px 0;
  min-height:118px;
}
nav .logo-mark{
  display:block;
  width:auto;
  height:clamp(78px,7vw,108px);
  object-fit:contain;
  object-position:left center;
  flex-shrink:0;
  transition:transform .25s ease;
}
nav .logo-mark:hover{transform:scale(1.03);}
nav .nav-right{
  display:flex;
  align-items:center;
  gap:10px;
}
.pill-btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:#000000;
  color:#ffffff;
  border:none;
  border-radius:100px;
  padding:12px 22px;
  font-family:var(--display);
  font-weight:700;
  font-size:13.5px;
  letter-spacing:.01em;
  transition:background .2s ease, transform .2s ease;
  white-space:nowrap;
  cursor:pointer;
}
.pill-btn:hover{background:#222;transform:translateY(-1px);}
.pill-btn svg{flex-shrink:0;}
.icon-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:44px;height:44px;
  border-radius:100px;
  background:#000000;
  border:1px solid #000000;
  color:#ffffff;
  transition:background .2s ease, transform .2s ease;
  flex-shrink:0;
}
.icon-btn:hover{background:#222;transform:translateY(-1px);}
@media (max-width:768px){
  .nav-inner{min-height:96px;padding:12px 0;}
  nav .logo-mark{height:58px;}
  nav .nav-right{gap:8px;}
  .icon-btn{width:40px;height:40px;}
}
@media (max-width:480px){
  .nav-inner{flex-wrap:wrap;row-gap:10px;}
  nav .logo-mark{height:48px;}
  .pill-btn span.label{display:none;}
  .pill-btn{padding:12px;}
}

/* ---------- hero ---------- */
.hero{
  position:relative;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  padding:0 clamp(20px,4vw,48px);
}
.tendrils{position:absolute;inset:0;width:100%;height:100%;opacity:.5;z-index:0;}
.tendrils path{
  fill:none;
  stroke:url(#tendrilGrad);
  stroke-width:1;
  stroke-linecap:round;
  stroke-dasharray:6 10;
  animation:drift 26s linear infinite;
}
.tendrils path:nth-child(2){animation-duration:34s;animation-direction:reverse;opacity:.6;}
.tendrils path:nth-child(3){animation-duration:19s;opacity:.4;}
@keyframes drift{ to{ stroke-dashoffset:-1000; } }
.cursor-glow{
  position:absolute;
  width:520px;height:520px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(0,0,0,.05) 0%, transparent 70%);
  pointer-events:none;
  transform:translate(-50%,-50%);
  left:50%;top:45%;
  transition:left .5s ease-out, top .5s ease-out;
  filter:blur(4px);
  z-index:0;
}
.hero-inner{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  gap:clamp(28px,6vw,56px);
  max-width:var(--max-w);
  width:100%;
  margin:0 auto;
  padding:clamp(48px,8vw,96px) 0 clamp(56px,9vw,110px);
}
.wordmark{
  font-family:var(--display);
  font-weight:700;
  font-size:clamp(56px, 12vw, 180px);
  line-height:.9;
  letter-spacing:-.03em;
  display:flex;
  overflow:hidden;
}
.wordmark span{
  display:inline-block;
  transform:translateY(110%);
  animation:riseIn .9s cubic-bezier(.2,.8,.2,1) forwards;
}
.wordmark span:nth-child(1){animation-delay:.1s;}
.wordmark span:nth-child(2){animation-delay:.17s;}
.wordmark span:nth-child(3){animation-delay:.24s;}
.wordmark span:nth-child(4){animation-delay:.31s;}
.wordmark span:nth-child(5){animation-delay:.38s;}
.wordmark span:nth-child(6){animation-delay:.45s;}
@keyframes riseIn{ to{ transform:translateY(0); opacity:1; } }

.hero-sub{
  color:#666;
  font-size:clamp(14px,1.4vw,16px);
  max-width:520px;
  line-height:1.5;
  opacity:0;
  animation:riseIn .8s .5s ease forwards;
}

/* ---------- CTA buttons ---------- */
.cta-row{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  opacity:0;
  animation:riseIn .8s .6s ease forwards;
}
.cta-btn{
  position:relative;
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:18px 32px;
  font-family:var(--display);
  font-weight:700;
  font-size:14px;
  letter-spacing:.02em;
  text-transform:uppercase;
  border-radius:100px;
  cursor:pointer;
  transition:transform .25s cubic-bezier(.2,.8,.2,1), background .25s ease, color .25s ease;
  border:2px solid #000;
  background:#000;
  color:#fff;
}
.cta-btn:active{transform:scale(.97);}
.cta-btn:hover{background:#222;color:#fff;transform:translateY(-2px);}
.cta-btn.outline{background:#fff;color:#000;}
.cta-btn.outline:hover{background:#f2f2f2;color:#000;}
.cta-btn .arrow{transition:transform .3s ease;}
.cta-btn:hover .arrow{transform:translateX(3px);}

/* ---------- footer ---------- */
footer{
  position:relative;
  z-index:2;
  display:flex;
  justify-content:center;
  padding:0 clamp(20px,4vw,48px) 34px;
}
.footer-inner{
  width:100%;
  max-width:var(--max-w);
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
  font-family:var(--mono);
  font-size:11px;
  color:#888;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;}
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(#f0f0f0 1px,transparent 1px),
    linear-gradient(90deg,#f0f0f0 1px,transparent 1px);
  background-size:48px 48px;
  opacity:.6;
  z-index:-1;
}
body::after{
  content:"";
  position:fixed;
  inset:18px;
  border:1px solid #ececec;
  pointer-events:none;
  z-index:10;
}
.hero::before,.hero::after{
  content:"";
  position:absolute;
  top:0;bottom:0;
  width:1px;
  background:#ececec;
  z-index:1;
}
.hero::before{left:calc(50% - (min(100vw,var(--max-w)) / 2));}
.hero::after{right:calc(50% - (min(100vw,var(--max-w)) / 2));}
@media (max-width:1420px){
  .hero::before{left:clamp(20px,4vw,48px);}
  .hero::after{right:clamp(20px,4vw,48px);}
}

/* ---------- catalog ---------- */
.catalog{
  position:relative;
  z-index:2;
  display:flex;
  justify-content:center;
  padding:0 clamp(20px,4vw,48px) 100px;
  scroll-margin-top:40px;
}
.catalog-inner{
  width:100%;
  max-width:var(--max-w);
}
.catalog-head{
  max-width:640px;
  margin-bottom:36px;
}
.catalog-head h2{
  font-family:var(--display);
  font-weight:700;
  font-size:clamp(30px,3.6vw,42px);
  letter-spacing:-.01em;
}
.catalog-head p{
  color:#666;
  font-size:14.5px;
  margin-top:8px;
  line-height:1.5;
}
.catalog-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(250px, 1fr));
  gap:22px;
}
.product-card{
  border:1px solid #eaeaea;
  border-radius:20px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  transition:border-color .25s ease, transform .25s ease, box-shadow .25s ease;
  background:#fff;
}
.product-card:hover{border-color:#ccc;transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.06);}
.product-photo{
  width:100%;
  aspect-ratio:1/1;
  background:#f5f5f5;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.product-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.product-photo .ph-placeholder{
  font-family:var(--mono);
  font-size:11.5px;
  color:#aaa;
  text-align:center;
  padding:12px;
}
.product-info{
  padding:18px 20px 22px;
  display:flex;
  flex-direction:column;
  gap:5px;
  flex:1;
}
.product-name{
  font-family:var(--display);
  font-weight:700;
  font-size:17px;
}
.product-spec{
  font-family:var(--mono);
  font-size:11.5px;
  color:#777;
}
.product-desc{
  font-size:12.5px;
  color:#888;
  line-height:1.45;
  margin-top:2px;
}
.product-price{
  margin-top:auto;
  padding-top:12px;
  font-family:var(--display);
  font-weight:700;
  font-size:19px;
}
.product-buy{
  margin-top:10px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  background:#000;
  color:#fff;
  border-radius:100px;
  padding:11px 18px;
  font-family:var(--display);
  font-weight:700;
  font-size:12.5px;
  text-transform:uppercase;
  letter-spacing:.02em;
  transition:background .2s ease;
}
.product-buy:hover{background:#222;}
</style>
</head>

<footer>

function renderCatalog() {
  const grid = document.getElementById("catalogGrid");
  if (!grid) return;

  grid.innerHTML = DEFAULT_PRODUCTS.map(product => `
    <article class="product-card">
      <div class="product-photo">
        ${
          product.photo
            ? `<img src="${product.photo}" alt="${product.name}">`
            : `<div class="ph-placeholder">Нет фото</div>`
        }
      </div>

      <div class="product-info">
        <div class="product-name">${product.name}</div>
        <div class="product-spec">${product.spec}</div>
        <div class="product-desc">${product.desc.replace(/\n/g, "<br>")}</div>
        <div class="product-price">${product.price}</div>
        <a
          class="product-buy"
          href="${CONFIG.managerUrl}"
          target="_blank"
          rel="noopener"
        >
          Заказать →
        </a>
      </div>
    </article>
  `).join("");
}

renderCatalog();

// cursor glow within hero
const hero = document.getElementById('hero');
const glow = document.getElementById('cursorGlow');
hero.addEventListener('mousemove', (e)=>{
  const r = hero.getBoundingClientRect();
  glow.style.left = (e.clientX - r.left) + 'px';
  glow.style.top = (e.clientY - r.top) + 'px';
});
</script>
